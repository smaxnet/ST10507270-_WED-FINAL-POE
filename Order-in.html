<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kota Bite | Check-Out</title><link rel="stylesheet" href="style.css">
</head>
<body class="page-checkout"> <!-- green colour -->

  <!-- HEADER -->
  <header class="header">
    <div class="navbar">
      <a class="logo" href="index.html">Kota<span>Bite</span></a>
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="menu.html">Menu</a>
        <a class="nav-link" href="order.html">Order</a>
        <a class="nav-link active" href="Take-away.html">Check-Out</a>
        <a class="nav-link" href="Order-in.html">Check-In</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="center">
      <span class="kicker">Pay</span>
      <h2 class="heading">Check-Out</h2> <!-- simple heading -->
    </div>

    <!-- TWO BOXES - bill and pay -->
    <div class="grid" style="margin-top:30px;">
      <!-- BILL BOX -->
      <div class="card">
        <h3 class="card-title">Your Bill</h3>
        <p class="summary-text">Kota x 2: R90</p>
        <p class="summary-text">Drink x 1: R15</p>
        <p class="price">Total: R105</p> <!-- price -->
        <p class="small">Price good for 7 days</p> <!-- small text -->
      </div>

      <!-- PAY BOX -->
      <div class="card">
        <h3 class="card-title">How to Pay</h3>
        <form class="form">
          <label class="label">Your Name</label>
          <input class="input" type="text" placeholder="Name">
          <label class="label">Cash or Card</label>
          <select class="input">
            <option>Cash</option>
            <option>Card</option>
          </select>
          <button class="btn" type="submit">Pay Now</button> <!-- button -->
        </form>
      </div>
    </div>
  </section>

  <!---FOOTER-->
<footer>
    <p>&copy;2026 Kota BITE .All Rights Reserved.|Durban,KwaZuLu-Natal,South Africa </p>
</footer>
</body>
</html>
